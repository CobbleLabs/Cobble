name: Build VMProtect

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Build VMProtect console and SDK
        shell: powershell
        run: .\build.ps1 -Platform x64

      - name: Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifact\sdk | Out-Null
          Copy-Item bin\64\Ultimate\VMProtectCon.exe artifact\
          Copy-Item bin\64\Ultimate\VMProtectSDK64.dll artifact\
          Copy-Item bin\64\Release\VMProtectSDK64.dll artifact\sdk\
          Copy-Item bin\64\Release\VMProtectSDK64.lib artifact\sdk\
          Copy-Item sdk\VMProtectSDK.h artifact\sdk\
          Compress-Archive -Path artifact\* -DestinationPath vmprotect-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: vmprotect-windows-x64
          path: vmprotect-windows-x64.zip

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" vmprotect-windows-x64.zip --generate-notes
