<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Vape 4.21 · Preview visual aislada</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="app.js"></script>
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <div class="ambient__sun"></div>
    <div class="ambient__mountain ambient__mountain--far"></div>
    <div class="ambient__mountain ambient__mountain--near"></div>
    <div class="ambient__ground"></div>
    <div class="ambient__vignette"></div>
  </div>

  <main class="preview-shell">
    <div class="safety-ribbon" role="status">
      <span class="safety-ribbon__title"><span class="status-dot"></span> PREVIEW VISUAL</span>
      <span>Sin Minecraft · sin inyección · sin red · sin módulos reales</span>
    </div>

    <div id="client-viewport" class="client-viewport">
      <section id="client" class="client" aria-label="Preview gráfica de la interfaz">
        <header class="client-header">
          <button class="brand" type="button" data-action="brand" aria-label="Restablecer la vista visual">
            <span class="brand__mark">V</span>
            <span class="brand__word">VAPE</span>
            <span class="brand__version">v4</span>
          </button>

          <nav class="section-tabs" aria-label="Secciones principales">
            <button class="section-tab is-active" type="button" data-section="modules">Modules</button>
            <button class="section-tab" type="button" data-section="friends">Friends</button>
            <button class="section-tab" type="button" data-section="profiles">Profiles</button>
          </nav>

          <div class="header-actions">
            <button class="icon-button is-subtle" type="button" data-action="sync" title="Simular guardado visual">
              <svg><use href="#icon-cloud"></use></svg>
            </button>
            <button class="icon-button" type="button" data-action="overlays" title="Overlays de muestra">
              <svg><use href="#icon-layers"></use></svg>
            </button>
            <button class="icon-button" type="button" data-action="settings" title="Ajustes visuales">
              <svg><use href="#icon-settings"></use></svg>
            </button>
          </div>
        </header>

        <div id="content" class="client-content"></div>
        <button id="backdrop" class="overlay-backdrop" type="button" aria-label="Cerrar panel"></button>
        <aside id="sidecar" class="sidecar" aria-hidden="true">
          <header class="sidecar__header">
            <span id="sidecar-leading" class="sidecar__leading"></span>
            <strong id="sidecar-title">Settings</strong>
            <button class="icon-button sidecar__close" type="button" data-action="close-sidecar" aria-label="Cerrar">
              <svg><use href="#icon-close"></use></svg>
            </button>
          </header>
          <div id="sidecar-content" class="sidecar__content"></div>
        </aside>
        <div id="toast" class="toast" role="status" aria-live="polite"></div>
      </section>
    </div>

    <p class="preview-hint">Haz clic en categorías, tarjetas, búsquedas y controles. Todo es una simulación local que se reinicia al recargar.</p>
  </main>

  <svg class="svg-sprite" aria-hidden="true">
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4.2 4.2"></path></symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"></path></symbol>
    <symbol id="icon-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Z"></path><path d="m3 12 9 5 9-5M3 16l9 5 9-5"></path></symbol>
    <symbol id="icon-cloud" viewBox="0 0 24 24"><path d="M7 18h11a4 4 0 0 0 .6-8A7 7 0 0 0 5.2 8.8 4.6 4.6 0 0 0 7 18Z"></path><path d="m9 13 3-3 3 3M12 10v6"></path></symbol>
    <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"></path></symbol>
    <symbol id="icon-star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-2.9-5.6 2.9 1.1-6.2L3 9.6l6.2-.9L12 3Z"></path></symbol>
    <symbol id="icon-sword" viewBox="0 0 24 24"><path d="m14 5 5-2-2 5-8.5 8.5-2-2L14 5Z"></path><path d="m5 13 6 6M4 20l3-3"></path></symbol>
    <symbol id="icon-eye" viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path><circle cx="12" cy="12" r="2.5"></circle></symbol>
    <symbol id="icon-wrench" viewBox="0 0 24 24"><path d="M14.5 6.5A5 5 0 0 0 7 12l-4 4 5 5 4-4a5 5 0 0 0 5.5-7.5l-3 3-3-3 3-3Z"></path></symbol>
    <symbol id="icon-world" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"></path></symbol>
    <symbol id="icon-box" viewBox="0 0 24 24"><path d="m4 7 8-4 8 4-8 4-8-4Z"></path><path d="M4 7v10l8 4 8-4V7M12 11v10"></path></symbol>
    <symbol id="icon-macro" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M7 9h2m2 0h2m2 0h2M7 13h2m2 0h6"></path></symbol>
    <symbol id="icon-shield" viewBox="0 0 24 24"><path d="M12 3 4.5 6v5.5c0 4.5 3 7.8 7.5 9.5 4.5-1.7 7.5-5 7.5-9.5V6L12 3Z"></path><path d="m9 12 2 2 4-4"></path></symbol>
    <symbol id="icon-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"></circle><path d="M3 20v-2a5 5 0 0 1 10 0v2M16 11a3 3 0 1 0 0-6M15 15a5 5 0 0 1 6 5"></path></symbol>
    <symbol id="icon-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></symbol>
    <symbol id="icon-profiles" viewBox="0 0 24 24"><rect x="4" y="4" width="12" height="14" rx="2"></rect><path d="M8 8h4M8 12h5M8 16h3M16 8h4v12H8v-2"></path></symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></symbol>
    <symbol id="icon-dots" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"></path></symbol>
    <symbol id="icon-back" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"></path></symbol>
    <symbol id="icon-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7h.01"></path></symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 14h8l1-14M10 11v6M14 11v6"></path></symbol>
    <symbol id="icon-edit" viewBox="0 0 24 24"><path d="m4 16-1 5 5-1L19 9l-4-4L4 16ZM13.5 6.5l4 4"></path></symbol>
    <symbol id="icon-grip" viewBox="0 0 24 24"><circle cx="8" cy="7" r="1"></circle><circle cx="16" cy="7" r="1"></circle><circle cx="8" cy="12" r="1"></circle><circle cx="16" cy="12" r="1"></circle><circle cx="8" cy="17" r="1"></circle><circle cx="16" cy="17" r="1"></circle></symbol>
  </svg>
</body>
</html>
